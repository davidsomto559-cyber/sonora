<!DOCTYPE html>
<html>
<head>
<title>Sonora - Instruments</title>
<style>
body{background:#0a0a0a; color:white; font-family:sans-serif; padding:20px}
h1{color:#a855f7}
.categories{display:grid; grid-template-columns:1fr 1fr; gap:15px}
.cat{background:#1a1a1a; padding:30px; border-radius:15px; text-align:center; cursor:pointer; border:1px solid #333}
.cat:hover{border-color:#a855f7; transform:scale(1.05)}
#search{width:100%; padding:15px; margin:20px 0; border-radius:10px; border:none; background:#1a1a1a; color:white}
.video-grid{display:grid; grid-template-columns:1fr; gap:15px; margin-top:20px}
.video-grid iframe{width:100%; height:200px; border-radius:10px}
</style>
</head>
<body>
<h1>Learn Instruments</h1>
<input id="search" type="text" placeholder="Search tutorial e.g guitar..." onkeyup="searchVideo(this.value)">

<div class="categories">
<div class="cat" onclick="show('drum tutorial')"><h2>🥁</h2>Percussion</div>
<div class="cat" onclick="show('keyboard piano tutorial')"><h2>🎹</h2>Keyboard</div>
<div class="cat" onclick="show('guitar tutorial for beginners')"><h2>🎸</h2>Guitar</div>
<div class="cat" onclick="show('drums tutorial')"><h2>🥁</h2>Drums</div>
<div class="cat" onclick="show('afrobeat vocal tutorial')"><h2>🎤</h2>Vocals</div>
<div class="cat" onclick="show('fl studio beat making')"><h2>🎧</h2>Beat Making</div>
</div>

<div class="video-grid" id="videoList">
<p style="color:gray; text-align:center">Click any category to load tutorials</p>
</div>

<script>
function show(query){
  document.getElementById('search').value = query;
  searchVideo(query);
}

function searchVideo(q){
  if(q.length < 2) return;
  let list = document.getElementById('videoList');
  // We use YouTube search embed trick - 3 videos
  list.innerHTML = `
    <h3>Results for: ${q}</h3>
    <iframe src="https://www.youtube.com/embed?listType=search&list=${q}" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed?listType=search&list=${q}+for+beginners" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed?listType=search&list=${q}+afrobeat" allowfullscreen></iframe>
  `;
}
</script>
</body>
</html>
