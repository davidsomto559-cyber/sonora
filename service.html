<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonora - Contact</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a1a;color:white;font-family:sans-serif;padding:20px 15px 90px 15px}
h1{font-size:28px;margin-bottom:5px}
.sub{color:#bca8d8;margin-bottom:20px;font-size:14px}
.card{background:#1c1430;border-radius:18px;padding:18px;margin-bottom:15px;border:1px solid #2a1f3d}
.card h3{color:#a855f7;margin-bottom:8px}
.card p{font-size:14px;color:#ccc;line-height:1.5}
input,textarea{width:100%;background:#0f0a1a;border:1px solid #2a1f3d;border-radius:12px;padding:14px;color:white;margin-bottom:12px;outline:none}
input:focus,textarea:focus{border-color:#a855f7}
.btn{width:100%;background:#a855f7;border:none;padding:15px;border-radius:30px;color:white;font-weight:bold;font-size:16px;cursor:pointer}
.btn:hover{background:#9333ea}
.socials{display:flex;gap:12px;margin-top:15px}
.socials div{background:#2a1f3d;padding:10px 16px;border-radius:20px;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1a122b;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #2a1f3d}
.nav div{text-align:center;font-size:11px;color:#888}
.nav .active{color:#a855f7}
</style>
</head>
<body>

<h1>Contact Phoenix</h1>
<p class="sub">Got a beat request? Holla at us</p>

<div class="card">
<h3>📧 Email Us</h3>
<p>davidsomto559@gmail.com<br>Response in 2 hours</p>
</div>

<div class="card">
<h3>📱 WhatsApp</h3>
<p>+234 9010826257<br>Tap to chat direct</p>
</div>

<div class="card">
<h3>Send Message</h3>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea rows="4" placeholder="give a feedback and some ratings"></textarea>
<button class="btn">Send Message 🚀</button>

<div class="socials">
<div>IG</div><div>X</div><div>YT</div><div>TikTok</div>
</div>
</div>

<div class="nav">
<div onclick="location.href='genres.html'">Genres</div>
<div>Browse</div>
<div>Create</div>
<div>Library</div>
<div class="active">Contact</div>
</div>

</body>
</html>
